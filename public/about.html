  <h1>About this project</h1>
  <p>
    This server demonstrates how popular frameworks work underneath: accept TCP
    connections, parse HTTP, and hand work to a bounded pool of OS threads.
  </p>
  <p>
    It intentionally avoids Actix, Axum, Hyper, and Tokio. Everything lives in
    the Rust standard library.
