[package]
name = "rs-threadpool-webserver"
version = "0.1.0"
edition = "2021"
description = "A multi-threaded TCP web server built from scratch in Rust using only the standard library"
license = "MIT"
readme = "README.md"
keywords = ["web-server", "threadpool", "http", "concurrency", "rust"]
categories = ["network-programming", "concurrency"]

[lib]
name = "rs_threadpool_webserver"
path = "src/lib.rs"

[[bin]]
name = "rs-threadpool-webserver"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
